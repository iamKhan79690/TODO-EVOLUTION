---
# Frontend Deployment for Next.js Application
# Following Phase IV Constitutional Requirements

apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-evolution-frontend
  labels:
    app: todo-evolution
    component: frontend
    version: "1.0.0"
    managed-by: helm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: todo-evolution
      component: frontend
  template:
    metadata:
      labels:
        app: todo-evolution
        component: frontend
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      serviceAccountName: todo-evolution-frontend
      containers:
      - name: frontend
        image: todo-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_API_URL
          value: "http://todo-evolution-backend:8000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: todo-evolution-frontend
  labels:
    app: todo-evolution
    component: frontend
    managed-by: helm
spec:
  type: LoadBalancer
  selector:
    app: todo-evolution
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-evolution-frontend
  labels:
    app: todo-evolution
    component: frontend
    managed-by: helm
automountServiceAccountToken: false
