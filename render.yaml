# Render Blueprint for TODO-Evolution Backend
# Deploy instructions: https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: todo-evolution-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # Set manually
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:3000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: MCP_SERVER_URL
        value: https://todo-evolution-mcp.onrender.com

  # MCP Server Service
  - type: web
    name: todo-evolution-mcp
    runtime: python
    region: oregon
    plan: free
    rootDir: mcp_server
    buildCommand: pip install fastapi uvicorn httpx python-dotenv pydantic
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BACKEND_URL
        fromService:
          name: todo-evolution-backend
          type: web
          property: host
