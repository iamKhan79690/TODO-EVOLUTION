# WebSocket API Specification
# AI Chat Assistant Real-time Communication

**Version**: 1.0.0
**Protocol**: WebSocket with Socket.io
**Endpoint**: `ws://localhost:8000/ws/chat`

## Connection

### Authentication
WebSocket connections must be authenticated via JWT token passed as query parameter:

```
ws://localhost:8000/ws/chat?token=<jwt_token>
```

### Connection Flow
1. Client connects with JWT token
2. Server validates token and extracts user_id
3. Client joins user-specific room: `user_{user_id}`
4. Client emits `join_conversation` for specific conversation

## Events

### Client → Server Events

#### `join_conversation`
Join a specific conversation room.

```json
{
  "event": "join_conversation",
  "data": {
    "conversation_id": "uuid",
    "room_id": "conversation_{conversation_id}"
  }
}
```

**Server Response**:
```json
{
  "event": "conversation_joined",
  "data": {
    "conversation_id": "uuid",
    "room_id": "conversation_{conversation_id}",
    "online_users": 1,
    "timestamp": "2025-01-15T10:30:00Z"
  }
}
```

#### `leave_conversation`
Leave a conversation room.

```json
{
  "event": "leave_conversation",
  "data": {
    "conversation_id": "uuid"
  }
}
```

#### `send_message`
Send a message to conversation.

```json
{
  "event": "send_message",
  "data": {
    "conversation_id": "uuid",
    "message": {
      "content": {
        "text": "Add task to buy groceries"
      },
      "message_type": "text",
      "metadata": {}
    },
    "temp_id": "client-generated-temp-id"
  }
}
```

**Server Response** (pending status):
```json
{
  "event": "message_status",
  "data": {
    "temp_id": "client-generated-temp-id",
    "status": "pending",
    "message_id": null,
    "timestamp": "2025-01-15T10:30:00Z"
  }
}
```

#### `typing_start`
Indicate user is typing.

```json
{
  "event": "typing_start",
  "data": {
    "conversation_id": "uuid"
  }
}
```

#### `typing_stop`
Indicate user stopped typing.

```json
