openapi: 3.0.3
info:
  title: Todo API
  description: RESTful API for the Evolution of Todo web application
  version: 1.0.0
  contact:
    name: Todo Project Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.todoapp.com
    description: Production server

paths:
  # Health check endpoint
  /health:
    get:
      summary: Health check
      description: Returns API health status
      tags:
        - System
      responses:
        '200':
          description: Healthy response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

  # Authentication endpoints
  /auth/me:
    get:
      summary: Get current user
      description: Returns information about the authenticated user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Task CRUD endpoints
  /tasks:
    get:
      summary: Get all tasks for authenticated user
      description: Retrieves all tasks belonging to the authenticated user with optional filtering
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: completed
          in: query
          schema:
            type: boolean
          description: Filter by completion status
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
          description: Filter by priority level
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Filter by tags (comma-separated)
        - name: due_before
          in: query
          schema:
            type: string
            format: date-time
          description: Filter tasks due before this date
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and description
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, due_date, priority, title]
            default: created_at
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of tasks to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of tasks to skip
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                    example: 42
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new task
      description: Creates a new task for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{task_id}:
    get:
      summary: Get a specific task
      description: Retrieves a specific task by ID for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update a task
      description: Updates an existing task for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Delete a task
      description: Deletes a specific task for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{task_id}/complete:
    post:
      summary: Mark task as complete
      description: Marks a specific task as completed for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task marked as complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{task_id}/uncomplete:
    post:
      summary: Mark task as incomplete
      description: Marks a specific task as incomplete for the authenticated user
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task marked as incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    TaskPriority:
      type: string
      enum: [low, medium, high]
      example: "medium"

    RecurrenceRule:
      type: object
      properties:
        type:
          type: string
          enum: [daily, weekly, monthly, yearly]
          example: "weekly"
        interval:
          type: integer
          minimum: 1
          example: 1
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          example: [1, 3, 5]
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          example: 15
        month_of_year:
          type: integer
          minimum: 1
          maximum: 12
          example: 6
        end_date:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"
        end_after_occurrences:
          type: integer
          minimum: 1
          example: 10

    ReminderConfig:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        minutes_before:
          type: integer
          minimum: 1
          maximum: 1440
          example: 15
        method:
          type: string
          enum: [email, notification]
          example: "notification"
        message:
          type: string
          example: "Task \"Buy groceries\" is due soon!"

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Buy groceries"
        description:
          type: string
          example: "Milk, eggs, bread, and vegetables for the week"
        priority:
          $ref: '#/components/schemas/TaskPriority'
        completed:
          type: boolean
          example: false
        due_date:
          type: string
          format: date-time
          example: "2024-01-20T18:00:00Z"
        tags:
          type: array
          items:
            type: string
          maxItems: 10
          example: ["shopping", "urgent"]
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        recurrence_rule:
          $ref: '#/components/schemas/RecurrenceRule'
        reminder_config:
          $ref: '#/components/schemas/ReminderConfig'

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Buy groceries"
        description:
          type: string
          example: "Milk, eggs, bread, and vegetables for the week"
        priority:
          $ref: '#/components/schemas/TaskPriority'
        due_date:
          type: string
          format: date-time
          example: "2024-01-20T18:00:00Z"
        tags:
          type: array
          items:
            type: string
          maxItems: 10
          example: ["shopping", "urgent"]
        recurrence_rule:
          $ref: '#/components/schemas/RecurrenceRule'
        reminder_config:
          $ref: '#/components/schemas/ReminderConfig'

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Buy groceries for dinner party"
        description:
          type: string
          example: "Ingredients for Saturday's dinner party"
        priority:
          $ref: '#/components/schemas/TaskPriority'
        completed:
          type: boolean
          example: true
        due_date:
          type: string
          format: date-time
          example: "2024-01-20T18:00:00Z"
        tags:
          type: array
          items:
            type: string
          maxItems: 10
          example: ["shopping", "urgent", "dinner"]
        recurrence_rule:
          $ref: '#/components/schemas/RecurrenceRule'
        reminder_config:
          $ref: '#/components/schemas/ReminderConfig'

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Not authenticated"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Task not found"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc:
                      type: array
                      items:
                        type: string
                      example: ["body", "title"]
                    msg:
                      type: string
                      example: "field required"
                    type:
                      type: string
                      example: "value_error.missing"

tags:
  - name: System
    description: System health and status endpoints
  - name: Authentication
    description: User authentication and authorization
  - name: Tasks
    description: Task management operations