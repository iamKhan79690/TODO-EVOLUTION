openapi: 3.0.3
info:
  title: ChatKit Frontend API
  description: API contracts for ChatKit frontend integration
  version: 1.0.0
  contact:
    name: Todo Evolution Team
    email: support@todo-evolution.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

paths:
  /api/conversations:
    get:
      summary: Get user conversations
      description: Retrieve all conversations for the authenticated user
      tags:
        - Conversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new conversation
      description: Create a new conversation for the authenticated user
      tags:
        - Conversations
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/conversations/{conversationId}:
    get:
      summary: Get conversation details
      description: Retrieve specific conversation details including messages
      tags:
        - Conversations
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update conversation
      description: Update conversation metadata
      tags:
        - Conversations
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Conversation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete conversation
      description: Delete a conversation and all its messages
      tags:
        - Conversations
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
      responses:
        '204':
          description: Conversation deleted successfully
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/conversations/{conversationId}/messages:
    get:
      summary: Get conversation messages
      description: Retrieve all messages for a specific conversation
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of messages to retrieve
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of messages to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Send message
      description: Send a new message to the conversation
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/conversations/{conversationId}/messages/{messageId}:
    delete:
      summary: Delete message
      description: Delete a specific message from the conversation
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          description: Message ID
          schema:
            type: string
      responses:
        '204':
          description: Message deleted successfully
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/conversations/{conversationId}/updates:
    get:
      summary: Get real-time updates
      description: Get updates for conversation since last known message
      tags:
        - Real-time
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
        - name: lastMessageId
          in: query
          required: false
          description: Last known message ID for incremental updates
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of updates to retrieve
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Updates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeUpdate'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/preferences:
    get:
      summary: Get user preferences
      description: Retrieve user preferences for chat interface
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User preferences retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user preferences
      description: Update user preferences for chat interface
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: User preferences updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Conversation:
      type: object
      description: Conversation entity
      properties:
        id:
          type: string
          description: Unique conversation identifier
          example: "conv_123456789"
        title:
          type: string
          description: Conversation title
          example: "Project Planning Discussion"
        userId:
          type: string
          description: User ID who owns the conversation
          example: "user_123"
        messageCount:
          type: integer
          description: Number of messages in conversation
          example: 25
        lastMessageAt:
          type: string
          format: date-time
          description: Timestamp of last message
          example: "2025-01-14T10:30:00Z"
        createdAt:
          type: string
          format: date-time
          description: Conversation creation timestamp
          example: "2025-01-14T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-14T10:30:00Z"
        isArchived:
          type: boolean
          description: Whether conversation is archived
          example: false
      required:
        - id
        - title
        - userId
        - messageCount
        - lastMessageAt
        - createdAt
        - updatedAt
        - isArchived

    Message:
      type: object
      description: Message entity
      properties:
        id:
          type: string
          description: Unique message identifier
          example: "msg_123456789"
        conversationId:
          type: string
          description: Conversation ID this message belongs to
          example: "conv_123456789"
        content:
          type: string
          description: Message content
          example: "Hello! How can I help you today?"
        sender:
          type: string
          enum: ["user", "assistant"]
          description: Message sender type
          example: "user"
        senderInfo:
          $ref: '#/components/schemas/SenderInfo'
        timestamp:
          type: string
          format: date-time
          description: Message timestamp
          example: "2025-01-14T10:30:00Z"
        status:
          $ref: '#/components/schemas/MessageStatus'
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
      required:
        - id
        - conversationId
        - content
        - sender
        - senderInfo
        - timestamp
        - status
        - metadata

    SenderInfo:
      type: object
      description: Information about the message sender
      properties:
        id:
          type: string
          description: Sender ID
          example: "user_123"
        name:
          type: string
          description: Sender display name
          example: "John Doe"
        avatar:
          type: string
          description: Avatar URL
          example: "https://example.com/avatar.jpg"
        email:
          type: string
          format: email
          description: Sender email
          example: "john@example.com"
      required:
        - id
        - name

    MessageStatus:
      type: string
      enum: ["sending", "sent", "delivered", "failed", "processing", "completed"]
      description: Message delivery status
      example: "sent"

    MessageMetadata:
      type: object
      description: Additional message metadata
      properties:
        wordCount:
          type: integer
          description: Number of words in message
          example: 42
        characterCount:
          type: integer
          description: Number of characters in message
          example: 256
        hasAttachments:
          type: boolean
          description: Whether message has attachments
          example: false
        processingTime:
          type: number
          description: Processing time in milliseconds
          example: 1500
        model:
          type: string
          description: AI model used for processing
          example: "gpt-4"
        tokens:
          type: object
          description: Token usage information
          properties:
            input:
              type: integer
              description: Input tokens used
              example: 50
            output:
              type: integer
              description: Output tokens used
              example: 150
      required:
        - wordCount
        - characterCount
        - hasAttachments

    CreateConversationRequest:
      type: object
      description: Request to create a new conversation
      properties:
        title:
          type: string
          description: Optional conversation title
          example: "New Chat"
      required: []

    UpdateConversationRequest:
      type: object
      description: Request to update conversation
      properties:
        title:
          type: string
          description: New conversation title
          example: "Updated Chat Title"
        isArchived:
          type: boolean
          description: Archive status
          example: false
      required:
        - []

    ConversationDetail:
      type: object
      description: Conversation with messages
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
              description: Messages in the conversation
            preview:
              type: string
              description: Conversation preview text
              example: "User: Hello! AI: How can I help?"
            unreadCount:
              type: integer
              description: Number of unread messages
              example: 2
          required:
            - messages
            - preview
            - unreadCount

    SendMessageRequest:
      type: object
      description: Request to send a message
      properties:
        content:
          type: string
          description: Message content to send
          example: "Hello AI assistant!"
      required:
        - content

    RealtimeUpdate:
      type: object
      description: Real-time update information
      properties:
        conversationId:
          type: string
          description: Conversation ID
          example: "conv_123456789"
        lastMessageId:
          type: string
          description: ID of the last message known to client
          example: "msg_123456789"
        updateCount:
          type: integer
          description: Number of updates since last poll
          example: 3
        lastUpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-01-14T10:30:00Z"
        isActive:
          type: boolean
          description: Whether conversation is currently active
          example: true
        newMessages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: New messages since last update
        updatedMessages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Updated messages since last poll
      required:
        - conversationId
        - updateCount
        - lastUpdatedAt
        - isActive

    UserPreferences:
      type: object
      description: User preferences for chat interface
      properties:
        theme:
          type: string
          enum: ["light", "dark", "system"]
          description: UI theme preference
          example: "light"
        fontSize:
          type: string
          enum: ["small", "medium", "large"]
          description: Font size preference
          example: "medium"
        messageSound:
          type: boolean
          description: Whether message sounds are enabled
          example: true
        desktopNotifications:
          type: boolean
          description: Whether desktop notifications are enabled
          example: true
        autoSave:
          type: boolean
          description: Whether auto-save is enabled
          example: true
        conversationAutoTitle:
          type: boolean
          description: Whether conversations are auto-titled
          example: true
        pollingInterval:
          type: integer
          description: Real-time update polling interval in milliseconds
          example: 2000
      required:
        - theme
        - fontSize
        - pollingInterval

    UpdatePreferencesRequest:
      type: object
      description: Request to update user preferences
      properties:
        theme:
          type: string
          enum: ["light", "dark", "system"]
          description: UI theme preference
          example: "dark"
        fontSize:
          type: string
          enum: ["small", "medium", "large"]
          description: Font size preference
          example: "large"
        messageSound:
          type: boolean
          description: Whether message sounds are enabled
          example: false
        desktopNotifications:
          type: boolean
          description: Whether desktop notifications are enabled
          example: false
        pollingInterval:
          type: integer
          description: Real-time update polling interval in milliseconds
          example: 3000
      required:
        - []

    Error:
      type: object
      description: Error response
      properties:
        detail:
          type: string
          description: Error message
          example: "Conversation not found"
        error_code:
          type: string
          description: Machine-readable error code
          example: "CONVERSATION_NOT_FOUND"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2025-01-14T10:30:00Z"
        path:
          type: string
          description: Request path
          example: "/api/conversations/123"
        method:
          type: string
          description: HTTP method
          example: "GET"
      required:
        - detail
        - error_code
        - timestamp

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authentication using Better Auth tokens

tags:
  - name: Conversations
    description: Conversation management endpoints
  - name: Messages
    description: Message management endpoints
  - name: Real-time
    description: Real-time update endpoints
  - name: User
    description: User management endpoints