{{- if .Values.backend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-evolution-backend
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "backend") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      serviceAccountName: todo-evolution-backend
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: HOST
          value: {{ .Values.backend.env.HOST | quote }}
        - name: PORT
          value: {{ .Values.backend.env.PORT | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.backend.env.LOG_LEVEL | quote }}
        - name: PYTHONPATH
          value: {{ .Values.backend.env.PYTHONPATH | quote }}
        - name: MCP_SERVER_URL
          value: {{ .Values.backend.env.MCP_SERVER_URL | quote }}
        - name: CORS_ORIGINS
          value: {{ .Values.backend.env.CORS_ORIGINS | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ (index .Values.backend.secretRefs 0).secretKeyRef.name }}
              key: {{ (index .Values.backend.secretRefs 0).secretKeyRef.key }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ (index .Values.backend.secretRefs 1).secretKeyRef.name }}
              key: {{ (index .Values.backend.secretRefs 1).secretKeyRef.key }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ (index .Values.backend.secretRefs 2).secretKeyRef.name }}
              key: {{ (index .Values.backend.secretRefs 2).secretKeyRef.key }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.probes.liveness.path }}
            port: http
          initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.probes.readiness.path }}
            port: http
          initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          {{- toYaml .Values.backend.securityContext | nindent 12 }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
{{- end }}
