{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-evolution-backend
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "backend") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: http
    protocol: TCP
  sessionAffinity: None
{{- end }}
