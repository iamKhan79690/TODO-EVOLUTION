{{- if .Values.mcpServer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-evolution-mcp-server
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
    component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "mcp-server") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.mcpServer.service.port }}
    targetPort: http
    protocol: TCP
  sessionAffinity: None
{{- end }}
