{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-evolution-frontend
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "frontend") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.frontend.service.port }}
    targetPort: http
    protocol: TCP
  sessionAffinity: None
{{- end }}
