{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-evolution-frontend
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-evolution.selectorLabels" (dict "Values" .Values "Component" "frontend") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      serviceAccountName: todo-evolution-frontend
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.frontend.env.NODE_ENV | quote }}
        - name: PORT
          value: {{ .Values.frontend.env.PORT | quote }}
        - name: BACKEND_URL
          value: {{ .Values.frontend.env.BACKEND_URL | quote }}
        - name: NEXT_PUBLIC_API_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL | quote }}
        - name: NEXT_PUBLIC_FASTAPI_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_FASTAPI_URL | quote }}
        - name: NEXT_PUBLIC_CHAT_API_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_CHAT_API_URL | quote }}
        - name: NEXT_PUBLIC_AUTH_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_AUTH_URL | quote }}
        - name: NEXT_PUBLIC_APP_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_APP_URL | quote }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.frontend.probes.liveness.path }}
            port: http
          initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ .Values.frontend.probes.readiness.path }}
            port: http
          initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          {{- toYaml .Values.frontend.securityContext | nindent 12 }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
{{- end }}
