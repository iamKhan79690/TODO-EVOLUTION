---
# Secrets for TODO Evolution Application
# WARNING: This is a placeholder. Do not commit actual secrets to git.

apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  labels:
    {{- include "todo-evolution.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database connection string
  # Format: postgresql+asyncpg://user:password@host:port/database
  DATABASE_URL: {{ .Values.secrets.databaseURL | quote }}

  # JWT secret for authentication (minimum 32 characters)
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # OpenAI API key for MCP server
  OPENAI_API_KEY: {{ .Values.secrets.openaiAPIKey | quote }}
